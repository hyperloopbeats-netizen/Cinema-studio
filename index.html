<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FractalOS // CinemaScope Studio</title>
    <meta
      name="description"
      content="Self-contained 2.39:1 anamorphic CinemaScope studio running on a black-and-orange MicroFractal OS with dual Movie and 3D auditorium projection, FractalBrain v2.5.0, Liquid 8K/16K/64K upscaling, color grading, and Gemini Studio Copilot."
    />
    <meta property="og:title" content="FractalOS // CinemaScope Studio" />
    <meta
      property="og:description"
      content="Self-contained 2.39:1 anamorphic CinemaScope studio running on a black-and-orange MicroFractal OS."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #050506;
        color: #f4f4f5;
        overflow: hidden;
      }
      #fractal-watchdog-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050506;
        color: #ff6a00;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        letter-spacing: 0.14em;
        z-index: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="fractal-watchdog-boot">FRACTALOS // INITIALIZING 2.39:1 CINEMASCOPE ENGINE</div>
    <div id="root"></div>
    <script>
      (function () {
        window.__FRACTAL_BOOT_TS__ = performance.now();
        window.__FRACTAL_WATCHDOG__ = {
          restarts: 0,
          lastFrameTs: performance.now(),
          healthy: false
        };
        setTimeout(function () {
          var bootEl = document.getElementById('fractal-watchdog-boot');
          if (bootEl && window.__FRACTAL_WATCHDOG__ && window.__FRACTAL_WATCHDOG__.healthy) {
            bootEl.style.display = 'none';
          }
        }, 1200);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
